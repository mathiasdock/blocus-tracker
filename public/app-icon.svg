<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Blocus Tracker</title>
  <desc id="desc">Un b minuscule dont la boucle forme un chronomètre, avec une aiguille beige.</desc>

  <!-- Fond de l'icône -->
  <rect width="1024" height="1024" fill="#14B885"/>

  <!-- Le b : silhouette haute, boucle largement fusionnée à la hampe -->
  <rect x="220" y="110" width="167" height="804" rx="72" fill="#0B2E23"/>
  <circle cx="515" cy="629" r="285" fill="#0B2E23"/>
  <circle cx="515" cy="629" r="173" fill="#14B885"/>

  <!-- Poussoir incliné du chronomètre -->
  <rect x="648" y="314" width="130" height="60" rx="22"
        fill="#0B2E23" transform="rotate(36 713 344)"/>

  <!-- Aiguille entièrement contenue dans le cadran -->
  <g fill="none" stroke="#F4E8D0" stroke-linecap="round">
    <line x1="515" y1="629" x2="598" y2="533" stroke-width="30"/>
  </g>
  <circle cx="515" cy="629" r="28" fill="#F4E8D0"/>
</svg>
